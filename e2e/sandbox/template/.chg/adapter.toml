# .chg/adapter.toml for loopctl's e2e sandbox (chg adapter contract v1), from
# chg/adapters/elixir/adapter.toml in mkreyman/loopctl.
[adapter]
kind = "elixir"
version = "1"
artifacts = ["deps", "_build"]
inputs = ["lib/**", "test/**", "config/**", "mix.exs", "mix.lock", ".tool-versions"]
always_all = [
  "mix.exs",
  "mix.lock",
  "config/**",
  "test/test_helper.exs",
  ".tool-versions",
  ".chg/**",
]
isolation_env = { MIX_TEST_PARTITION = "{workspace_slot}" }

[commands]
snapshot = "mix chg.snapshot"
static   = "MIX_ENV=test mix chg.static --base {base}"
affected = "MIX_ENV=test mix chg.affected --base {base}"
run      = "MIX_ENV=test mix chg.run --tests {file}"
shard    = "MIX_ENV=test mix chg.shard --of {n} --index {i}"
