name: chg CI

# chg (chg/, US-52.5), ported from chg's own ci.yml before the import and gated only when a change touches
# chg/ (US-52.6). Every job but the area gate runs on the fleet-ci runner pool or the
# CI_RUNNER_MACOS runner, never on GitHub-hosted minutes. Jobs share one persistent account there, so nothing below
# writes per-user state such as `git config --global` or `rustup default`. No paths filter:
# a job skipped by its `if:` reports skipped, which a required check accepts.
#
# Push of every branch, and no pull_request: the merge gate trusts only push runs of a
# story's branch at its head, and a same-repo pull request's checks are the push run's check
# runs on its head sha (ci.yml says more). The nightly run counts as every area, as ci.yml's
# does.
on:
  push:
    branches: ["**"]
  schedule:
    - cron: "0 2 * * *"

# A branch keeps only its newest run: a later push cancels the earlier one, and
# areas-output.sh judges a branch push from its merge base with master, so the later run
# covers the cancelled run's areas. Every master run gets its own group (keyed by sha), so no
# master commit loses its verdict to a later push: chg's post-merge verifier and culprit
# finder need one result per commit.
concurrency:
  group: chg-ci-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

# Incremental builds are slow to cache and useless in CI.
env:
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: changes
    runs-on: [self-hosted, fleet-ci]
    outputs:
      chg: ${{ steps.areas.outputs.chg }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          # clean: false, then the clean step: .github/scripts/clean-workspace.sh says why.
          clean: false
      - name: Clean the workspace, keeping the compiled trees
        working-directory: .
        run: .github/scripts/clean-workspace.sh
      - id: areas
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: .github/scripts/areas-output.sh

  rust:
    name: rust (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.chg == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
          # The APFS clonefile(2) path only compiles for macOS. The repository variable
          # CI_RUNNER_MACOS (a JSON label list) runs this leg natively, tests included. Unset,
          # it runs on fleet-ci and cross-checks the Macs' target with clippy, no link and no
          # tests: never a hosted macOS runner.
          - os: macos
    runs-on: ${{ matrix.os == 'macos' && vars.CI_RUNNER_MACOS && fromJSON(vars.CI_RUNNER_MACOS) || fromJSON('["self-hosted","fleet-ci"]') }}
    env:
      CROSS: ${{ matrix.os == 'macos' && !vars.CI_RUNNER_MACOS && '--target aarch64-apple-darwin' || '' }}
    timeout-minutes: 24
    defaults:
      run:
        working-directory: chg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # clean: false, then the clean step: .github/scripts/clean-workspace.sh says why.
          clean: false
      - name: Clean the workspace, keeping the compiled trees
        working-directory: .
        run: .github/scripts/clean-workspace.sh
      - name: Toolchain from .tool-versions
        run: scripts/ci-rust-toolchain.sh --component rustfmt --component clippy $CROSS
      # The Linux clone tests need reflink: each fleet-ci host's chg volume is XFS with
      # reflink. Without it they fail rather than skip: CI=true makes a missing
      # CHG_TEST_REFLINK_DIR an error.
      - name: chg volume
        if: matrix.os == 'linux'
        run: |
          if [ -d /srv/chg/ci-tmp ] && [ -w /srv/chg/ci-tmp ]; then
            echo "CHG_TEST_REFLINK_DIR=/srv/chg/ci-tmp" >> "$GITHUB_ENV"
          fi
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          key: ${{ runner.environment }}-rust-${{ matrix.os }}
      - run: cargo fmt --all --check
        if: matrix.os == 'linux'
      - run: cargo clippy --all-targets --locked $CROSS -- -D warnings
      # No --all-targets: that flag excludes doctests.
      - run: cargo test --locked
        if: env.CROSS == ''
      # Only master saves, only when nothing under the base key was restored, at most 3
      # minutes and never fatally.
      - name: Save the cargo cache
        if: github.ref == 'refs/heads/master' && steps.cargo-cache.outputs.matched == ''
        uses: ./.github/actions/cargo-cache-save
        timeout-minutes: 3
        continue-on-error: true
        with:
          base: ${{ steps.cargo-cache.outputs.base }}

  # bin/chg-volume-setup.sh mounts and writes fstab, so its test needs root: it runs in a
  # --privileged container through the docker group. That container is not isolation (the
  # docker group is root-equivalent on every fleet-ci host); its fstab and mounts are the
  # container's, which keeps the test off the host's /etc/fstab and /srv/chg.
  volume-setup:
    name: volume-setup (linux)
    needs: [changes]
    if: needs.changes.outputs.chg == 'true'
    runs-on: [self-hosted, fleet-ci]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: chg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # clean: false, then the clean step: .github/scripts/clean-workspace.sh says why.
          clean: false
      - name: Clean the workspace, keeping the compiled trees
        working-directory: .
        run: .github/scripts/clean-workspace.sh
      # apt uses mirrors.edge.kernel.org and each apt command is capped at 5 minutes: on
      # 2026-11-09 archive.ubuntu.com stopped answering and apt waited out the job's cap.
      # The container is named, so a cancelled job's container is still removed.
      - name: shellcheck, and the volume setup test as root in a container
        run: |
          docker run --rm --name "chg-volume-setup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --privileged -v "$PWD:/w:ro" -w /w ubuntu:24.04 bash -euc '
            sed -i -E "s#http://(archive|security)\.ubuntu\.com/ubuntu/?#http://mirrors.edge.kernel.org/ubuntu/#" /etc/apt/sources.list.d/ubuntu.sources
            apt="-q -o Acquire::http::Timeout=20 -o Acquire::Retries=3"
            timeout 300 apt-get $apt update >/dev/null
            timeout 300 apt-get $apt install -y xfsprogs git sudo shellcheck >/dev/null
            shellcheck bin/chg-volume-setup.sh tests/volume-setup-test.sh scripts/ci-rust-toolchain.sh \
              bin/chg-outbox-cron.sh tests/outbox-cron-test.sh
            bash tests/outbox-cron-test.sh
            useradd -m ci && echo "ci ALL=(ALL) NOPASSWD: ALL" >/etc/sudoers.d/ci
            sudo -u ci sudo bash tests/volume-setup-test.sh'
      - name: remove the container if the job was cancelled
        if: always()
        run: docker rm -f "chg-volume-setup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >/dev/null 2>&1 || true

  # The Mix adapter (chg/adapters/elixir): unit tests, and an integration test that installs it
  # as an archive and drives a fixture project through every task, including `chg adapter
  # exec` (CHG_BIN). Twice: on its .tool-versions, and on the oldest Elixir its mix.exs accepts.
  elixir-adapter:
    name: ${{ matrix.name }}
    needs: [changes]
    if: needs.changes.outputs.chg == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: elixir-adapter (linux)
          - name: elixir-adapter (linux, elixir 1.19)
            elixir: "1.19.5"
    runs-on: [self-hosted, fleet-ci]
    timeout-minutes: 24
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@localhost
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@localhost
    defaults:
      run:
        working-directory: chg/adapters/elixir
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # clean: false, then the clean step: .github/scripts/clean-workspace.sh says why.
          clean: false
      - name: Clean the workspace, keeping the compiled trees
        working-directory: .
        run: .github/scripts/clean-workspace.sh
      # Mix keeps its build-lock files in $TMPDIR, and a job killed mid-compile leaves one
      # behind that a later job on this slot can wait on (#119). RUNNER_TEMP is emptied per job.
      - name: Per-job TMPDIR
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@v1
        if: ${{ !matrix.elixir }}
        with:
          version-file: chg/adapters/elixir/.tool-versions
          version-type: strict
      # The pinned OTP, so the two legs differ only in Elixir.
      - name: OTP from .tool-versions
        if: ${{ matrix.elixir }}
        id: otp
        working-directory: chg
        run: echo "version=$(awk '$1=="erlang"{print $2}' adapters/elixir/.tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: erlef/setup-beam@v1
        if: ${{ matrix.elixir }}
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ steps.otp.outputs.version }}
          version-type: strict
      - name: Rust toolchain from .tool-versions
        working-directory: chg
        run: scripts/ci-rust-toolchain.sh
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          key: ${{ runner.environment }}-elixir-${{ matrix.elixir || 'pinned' }}
      - name: Build chg
        working-directory: chg
        run: cargo build --locked -p chg && echo "CHG_BIN=$PWD/target/debug/chg" >> "$GITHUB_ENV"
      # The formatter's output differs across versions: checked on the pinned one only.
      - run: mix format --check-formatted
        if: ${{ !matrix.elixir }}
      - run: mix compile --warnings-as-errors
      - run: mix test
      - name: Save the cargo cache
        if: github.ref == 'refs/heads/master' && steps.cargo-cache.outputs.matched == ''
        uses: ./.github/actions/cargo-cache-save
        timeout-minutes: 3
        continue-on-error: true
        with:
          base: ${{ steps.cargo-cache.outputs.base }}

  # The pnpm adapter (chg/adapters/typescript): unit tests, and an integration test that drives
  # a fixture workspace through every command, including `chg adapter exec` (CHG_BIN).
  typescript-adapter:
    name: typescript-adapter (linux)
    needs: [changes]
    if: needs.changes.outputs.chg == 'true'
    runs-on: [self-hosted, fleet-ci]
    timeout-minutes: 24
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@localhost
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@localhost
    defaults:
      run:
        working-directory: chg/adapters/typescript
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # clean: false, then the clean step: .github/scripts/clean-workspace.sh says why.
          clean: false
      - name: Clean the workspace, keeping the compiled trees
        working-directory: .
        run: .github/scripts/clean-workspace.sh
      - uses: actions/setup-node@v4
        with:
          node-version-file: chg/adapters/typescript/.tool-versions
      # Into this job's RUNNER_TEMP: the default dest is one directory for every slot of the
      # runner account, and another slot's install replaced it mid-run (2026-10-29).
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          dest: ${{ runner.temp }}/setup-pnpm
      - name: pnpm is this job's own
        run: |
          pnpm_bin=$(command -v pnpm) || {
            echo "::error::pnpm is not on PATH after pnpm/action-setup (PATH=$PATH)"
            exit 1
          }
          case $pnpm_bin in
            "$RUNNER_TEMP"/*) ;;
            *) echo "::error::pnpm resolves to $pnpm_bin, outside this job's RUNNER_TEMP"
               exit 1 ;;
          esac
          pnpm --version
      - name: Rust toolchain from .tool-versions
        working-directory: chg
        run: scripts/ci-rust-toolchain.sh
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          key: ${{ runner.environment }}-typescript
      - name: Build chg
        working-directory: chg
        run: cargo build --locked -p chg && echo "CHG_BIN=$PWD/target/debug/chg" >> "$GITHUB_ENV"
      - run: node --test test/unit.test.mjs test/integration.test.mjs
      - name: Save the cargo cache
        if: github.ref == 'refs/heads/master' && steps.cargo-cache.outputs.matched == ''
        uses: ./.github/actions/cargo-cache-save
        timeout-minutes: 3
        continue-on-error: true
        with:
          base: ${{ steps.cargo-cache.outputs.base }}

  # The generic adapter (a repo with no build: claude-config) in a throwaway repo with a fake
  # selector and runner, then chg-loop and the selection replay on fixtures.
  generic-adapter:
    name: generic-adapter (linux)
    needs: [changes]
    if: needs.changes.outputs.chg == 'true'
    runs-on: [self-hosted, fleet-ci]
    timeout-minutes: 19
    defaults:
      run:
        working-directory: chg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # clean: false, then the clean step: .github/scripts/clean-workspace.sh says why.
          clean: false
      - name: Clean the workspace, keeping the compiled trees
        working-directory: .
        run: .github/scripts/clean-workspace.sh
      - name: Rust toolchain from .tool-versions
        run: scripts/ci-rust-toolchain.sh
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          key: ${{ runner.environment }}-generic
      - name: Build chg
        run: cargo build --locked -p chg && echo "CHG_BIN=$PWD/target/debug/chg" >> "$GITHUB_ENV"
      - run: python3 adapters/generic/test/test_adapter.py -v
      - name: chg-loop on fixtures (no GitHub)
        run: python3 tests/loop-test.py
      - name: chg-replay-selection on fake builds (no cargo, no network)
        run: python3 tests/replay-selection-test.py
      - name: Save the cargo cache
        if: github.ref == 'refs/heads/master' && steps.cargo-cache.outputs.matched == ''
        uses: ./.github/actions/cargo-cache-save
        timeout-minutes: 3
        continue-on-error: true
        with:
          base: ${{ steps.cargo-cache.outputs.base }}

  # THE AREA GATE, the one check the merge gate's independent_checks names for this repository:
  # the same job, under the same name, ends ci.yml, runner-ci.yml, chg-ci.yml and e2e.yml. It
  # needs every job a push can run, and passes only when changes succeeded and every other
  # need succeeded or was skipped by area; a failed or cancelled need fails it. always(), so
  # a need that failed or was skipped never skips the gate itself. The one job here off the
  # fleet-ci pool: hosted and checkout-free, it reads only the needs' results.
  area-gate:
    name: area gate
    needs: [changes, rust, volume-setup, elixir-adapter, typescript-adapter, generic-adapter]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded or was skipped by area
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if [ "$(jq -r '.changes.result' <<<"$NEEDS")" != success ]; then
            echo "::error::changes did not succeed, so no area was judged"
            exit 1
          fi
          bad=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"' <<<"$NEEDS")
          if [ -n "$bad" ]; then
            echo "::error::not green: $(tr '\n' ' ' <<<"$bad")"
            exit 1
          fi
