name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Nightly at 02:00 UTC — the ordinary jobs (lint / test / retrieval-eval / security /
    # dialyzer / scale-test / pgbouncer-e2e). Explicitly NOT scale-nightly: that matrix is
    # gated to manual dispatch and would otherwise hold the one self-hosted runner
    # for hours every night, queued ahead of ordinary PR checks.
    - cron: "0 2 * * *"
  # Manual trigger so the scale-nightly matrix can be RUN and validated on a branch BEFORE
  # merge — `gh workflow run CI --ref <branch>` (US-27.5). This is the PRIMARY trigger for a
  # Theme-2/3/4 change, and since there is no cron it is the ONLY thing that runs the matrix.
  # Without this the matrix change is never exercised by its own PR.
  workflow_dispatch:

# TWO RUNS OF THIS REPO MUST NOT OVERLAP ON ONE RUNNER HOST.
#
# The test databases are named from MIX_TEST_PARTITION, which was the constant
# `ci`, so a PR run and a master run both computed loopctl_testci and whichever
# reached ecto.create second dropped the database the other was mid-suite on. The
# run id in MIX_TEST_PARTITION below closes that properly; this group is the
# cheaper half of the same fix and stops two runs of one branch competing for the
# five runners.
#
# cancel-in-progress is FALSE on master on purpose: a superseded PR run is waste,
# but a superseded master run is the only CI evidence a merged commit was green,
# and Deploy hangs off it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.19.5"
  # OTP 28.5.0.2 (latest 28.x). Hex 2.5.0 calls :re.import/2, which only exists on
  # OTP >= 28.1; on the previous pin (28.0) `mix deps.get` crashed with an :undef
  # the moment Hex 2.5.0 shipped (2026-06-29). Elixir 1.19 requires OTP 28.1+, so
  # 28.0 was below its own floor. Keep Elixir at 1.19.5 (current 1.19, satisfies
  # mix.exs `~> 1.18`); only the OTP line moves forward to a working, current patch.
  OTP_VERSION: "28.5.0.2"

# SELF-HOSTED SPLIT (nuc since 2026-08-07, beelink before it). lint / test /
# security / dialyzer moved; the rest
# stay on ubuntu-latest for specific reasons, not by omission. Measured job times
# (2026-07-30) are recorded per entry, because the whole point of the split is
# billed minutes and an unmeasured "it is rare" claim is how cost hides:
#
#   pgbouncer-e2e   1.4-2.4 min, EVERY push and PR. Needs pgbouncer in front of
#                   Postgres; the port topology has to be reworked for a shared
#                   host DB. Also GATES deploy, so it cannot simply be dropped.
#   scale-test      3.1-5.1 min, EVERY push and PR -- its `if:` is
#                   schedule || push || pull_request, i.e. effectively always.
#                   (An earlier version of this comment called it
#                   "schedule/dispatch-gated ... rare". That was wrong: it is the
#                   narrowly-gated scale-NIGHTLY matrix that is rare. The mistake
#                   understated the recurring cost, which is exactly the number
#                   this block exists to make visible.)
#   scale-nightly   ZERO billed hosted minutes: it moved self-hosted (the port is
#                   DONE -- see the per-matrix-file database note on the job) and
#                   it no longer runs nightly. ~143 min of wall clock per full
#                   14-file matrix (one outlier, streaming_export, is 40 min on
#                   its own) -- MEASURED ON BEELINK, 24 cores. The host is now
#                   nuc at 4 cores, so treat 143 as a floor, not an estimate,
#                   until it is re-measured. Now only on an explicit dispatch plus any
#                   manual dispatch -- so ~620 min/month (143 x 52/12) of self-hosted time in
#                   place of the ~4,300 billed min/month it used to be, when it
#                   was the largest hosted line item by a wide margin.
#   deploy          Holds Fly deploy credentials and needs flyctl. Keeping release
#   smoke           authority on GitHub-hosted runners is deliberate and should
#                   NOT be "optimised" onto the self-hosted box. The argument
#                   was written when that box was beelink, holding Mark's SSH
#                   key and the Hetzner API token. It applies MORE strongly to
#                   nuc, which holds an SSH key, the Fly API tokens and the
#                   Tigris archive credentials for the infra-* timers. Putting
#                   deploy credentials there widens the blast radius of any
#                   compromised dependency far more than the ~0.8 min/month of
#                   billed time is worth.
jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, beelink]
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          # Key on config/*.exs too: deps like phoenix_ecto read parent-app
          # config (e.g. :exclude_ecto_exceptions_from_plug) at THEIR compile
          # time, but a config-only change does not mark the dep stale. Without
          # this, a restored _build can keep a stale dep beam that collides with
          # our own defimpl and fails `mix compile --warnings-as-errors`. No loose
          # restore-keys for the same reason — a config change must not silently
          # reuse a _build compiled under the old config.
          key: ${{ runner.os }}-${{ runner.environment }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock', 'config/*.exs') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check unused dependencies
        run: mix deps.unlock --check-unused

      - name: Run Credo
        run: mix credo --strict

      # #541— nothing in CI compiled assets/js before this. A syntax or import
      # error in a LiveView hook therefore surfaced only in the Docker build at
      # DEPLOY time (Dockerfile runs `mix assets.deploy`), long after review.
      # That gap stopped being tolerable once /enroll shipped a ceremony that is
      # entirely client-side: for that page, broken JS is a broken feature with a
      # green build. esbuild and tailwind are standalone binaries — no Node.js.
      - name: Install asset toolchain
        run: mix assets.setup

      - name: Build assets
        run: mix assets.deploy

  test:
    name: Test
    runs-on: [self-hosted, beelink]
    # NO `services:` block on self-hosted. nuc already runs a long-lived
    # Postgres 16 bound to 127.0.0.1:5432 — reachable because the job runs ON that
    # host — the same database local `mix test`
    # uses — so a service container declaring 5432:5432 cannot bind and the job
    # would die before its first step. Verified that host instance has pgvector
    # 0.8.2 available, which is why the pgvector image is not needed here.
    # config/test.exs hardcodes localhost + postgres/postgres for all three repos.
    env:
      # ci<run_id>, not the bare `ci` this used to be. The suffix separated CI from a
      # developer's loopctl_test -- a real fix -- but not one CI run from another,
      # because it did not vary by run. config/test.exs builds the database name from
      # this, and the psql steps below interpolate the same variable, so one value
      # keeps all of them on the same database.
      #
      # Safe as a non-integer: this job does not pass `mix test --partitions`, which is
      # the only thing that validates the variable as a bare 1..N.
      MIX_TEST_PARTITION: ci${{ github.run_id }}
      # The CI-only Postgres, NOT the instance on 5432 -- which, now that the runners
      # are back on beelink, holds Mark's development databases.
      TEST_DB_PORT: "5433"
      # The psql steps below use libpq directly; PGPORT is what points THEM at the
      # same instance the Ecto repos use. Setting only one of the two is the bug
      # this pairing exists to prevent -- the grants would land on 5432.
      PGPORT: "5433"

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          # See lint job: config/*.exs is part of the key so a config-only change
          # (e.g. :exclude_ecto_exceptions_from_plug) forces a clean recompile of
          # config-sensitive deps instead of reusing a stale dep beam.
          key: ${{ runner.os }}-${{ runner.environment }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock', 'config/*.exs') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Create RLS roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'loopctl_app') THEN
                CREATE ROLE loopctl_app LOGIN PASSWORD 'loopctl_app';
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'loopctl_admin') THEN
                CREATE ROLE loopctl_admin LOGIN PASSWORD 'loopctl_admin' BYPASSRLS;
              END IF;
            END \$\$;
          "

      # These steps target "loopctl_test$MIX_TEST_PARTITION", NOT a hardcoded
      # loopctl_test, and that is a FIX rather than a tidy-up.
      #
      # MIX_TEST_PARTITION is `ci` for this job, so config/test.exs points all three repos
      # at loopctl_testci while these psql steps were still hardcoded to loopctl_test.
      # On the hosted runner that was merely useless (the container's only database was
      # loopctl_test). On the self-hosted box loopctl_test is the DEVELOPER'S local test
      # database, so every CI run was issuing GRANT and ALTER DEFAULT PRIVILEGES against
      # it while the database the suite actually used never received them.
      #
      # Observed before this change: loopctl_testci had USAGE but not CREATE on schema
      # public and one default-ACL entry, while the local loopctl_test had two — CI's
      # grants, landed on the wrong database. The suite passed anyway, which is what made
      # this invisible: nothing in it currently needs loopctl_app to hold CREATE.
      #
      # Order matters for the same reason as in scale-nightly: on a fresh machine the
      # database does not exist until ecto.create, and ALTER DEFAULT PRIVILEGES only
      # affects tables created after it runs, so it has to sit between create and migrate.
      - name: Create the database
        run: mix ecto.create

      - name: Grant RLS roles on the schema, before any table exists
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d "loopctl_test${MIX_TEST_PARTITION}" -c "
            GRANT USAGE, CREATE ON SCHEMA public TO loopctl_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO loopctl_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO loopctl_app;
          "

      - name: Migrate
        run: mix ecto.migrate

      - name: Grant RLS roles access to tables
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d "loopctl_test${MIX_TEST_PARTITION}" -c "
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO loopctl_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO loopctl_app;
          "

      # No DATABASE_URL: config/runtime.exs reads it only under
      # `if config_env() == :prod`, so in MIX_ENV=test it was dead config that looked
      # like it selected the database. config/test.exs selects it, from MIX_TEST_PARTITION.
      - name: Run tests
        run: mix test

      # The cross-context journeys (test/e2e/*) are @moduletag :e2e and excluded
      # from the default `mix test` above (keeps it fast). Run them here in the
      # SAME job so they reuse the provisioned Postgres and GATE deploy (deploy
      # `needs: [test]`) — otherwise the regression net never fires in CI.
      # `--only e2e` overrides the default exclude and won't pull :scale/:pgbouncer.
      - name: Run e2e journey tests
        run: mix test --only e2e
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/loopctl_test

  retrieval-eval:
    name: Retrieval Eval
    runs-on: [self-hosted, beelink]
    # MIX_ENV=dev on purpose (the workflow-level default is test): `mix
    # loopctl.retrieval.eval` opens its OWN DB connections, and config/test.exs puts all
    # three repos behind Ecto.Adapters.SQL.Sandbox, where a non-checked-out process has no
    # ownership and every query would fail. Dev is the same environment a developer runs
    # the task in, so CI exercises the real invocation.
    env:
      MIX_ENV: dev
      # THIS JOB USED TO POINT AT loopctl_dev, and the note that made that safe was
      # "which Mark confirmed is disposable on nuc". Moving the runners back to
      # beelink invalidated it: there, loopctl_dev is Mark's REAL development
      # database, and this job does not just read -- it runs ecto.create, ecto.migrate
      # and GRANTs, so every CI run would apply the branch's migrations to live dev
      # data. config/dev.exs now takes these two overrides, defaulting to the old
      # values so a developer sees no change.
      DEV_DB_NAME: loopctl_ci_eval_${{ github.run_id }}
      DEV_DB_PORT: "5433"
      # psql in the steps below picks the port up from PGPORT; the Ecto repos use
      # DEV_DB_PORT above. Both name the CI-only instance, never 5432.
      PGPORT: "5433"
    # No services block on self-hosted: the host already holds 5432 and 5433, so a
    # service container could not bind either. 5433 is the CI-only instance, which
    # carries pgvector in the image layer.
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          # See lint job: config/*.exs is part of the key so a config-only change
          # forces a clean recompile of config-sensitive deps instead of reusing a
          # stale dep beam. No loose restore-keys, for the same reason.
          #
          # `-dev` suffix on purpose: this is the ONLY job that runs MIX_ENV=dev. Sharing
          # the exact key of the MIX_ENV=test jobs means that on a key miss GitHub saves
          # from whichever job finishes first — if it is this one, the saved _build holds
          # only _build/dev and every test job then restores a tree with no test artifacts
          # and recompiles. A distinct key keeps the dev and test build trees from
          # clobbering each other in the cache.
          key: ${{ runner.os }}-${{ runner.environment }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock', 'config/*.exs') }}-dev

      - name: Install dependencies
        run: mix deps.get

      # #556: AGENTS.md's usage-rules block is GENERATED, and nothing regenerates or
      # verifies it — same failure shape as the undocumented-env-var problem already gated
      # by `mix loopctl.check_env_docs`. SCOPE, stated so nobody over-trusts this gate:
      # mix.exs `usage_rules/0` names an EXPLICIT package list, not `:all`, so drift is
      # caught for those packages (an upgrade that rewrites their rules text, a hand edit
      # inside the markers, a change to the list itself). Adding an unrelated dependency
      # produces no drift and stays green — even one shipping usage-rules, as igniter and
      # mdex already do.
      #
      # It rides THIS job, whose subject is otherwise unrelated, for one reason:
      # `usage_rules` is `only: :dev` and the workflow-level default is `MIX_ENV: test`,
      # so this is the ONLY job where the task exists at all. Putting it in Lint failed
      # with "task could not be found" (observed, not predicted — CI caught it), and
      # setting MIX_ENV=dev on a single Lint step would build every dep in an uncached dev
      # profile just to read a markdown block. It is also NOT in `mix precommit`: that
      # alias runs under `preferred_envs: [precommit: :test]` and would hit the same
      # missing task — the exact breakage the hex.audit note in mix.exs records once
      # already.
      #
      # Runs before the DB setup below so it fails fast, and needs neither DB nor network.
      # `--check` reports drift and exits non-zero WITHOUT rewriting the file (verified).
      - name: Check AGENTS.md usage-rules block is not stale
        run: mix usage_rules.sync --check

      - name: Create RLS roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'loopctl_app') THEN
                CREATE ROLE loopctl_app LOGIN PASSWORD 'loopctl_app';
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'loopctl_admin') THEN
                CREATE ROLE loopctl_admin LOGIN PASSWORD 'loopctl_admin' BYPASSRLS;
              END IF;
            END \$\$;
          "

      # config/dev.exs points every repo at postgres:postgres@localhost/loopctl_dev, so
      # the dev database is created here rather than reusing the service's loopctl_test.
      - name: Setup database
        run: mix ecto.create && mix ecto.migrate

      - name: Grant RLS roles access to tables
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d "$DEV_DB_NAME" -c "
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO loopctl_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO loopctl_app;
          "

      # #469: the retrieval-quality GATE. Runs the committed golden question set through
      # search_combined/3 in BOTH the embeddings and keyword-only arms and fails when an
      # aggregate metric drops below the committed baseline beyond tolerance. It gates
      # deploy on purpose — #470 (RRF) and #471 (recency/authority) are only reviewable
      # against a delta from this, so an advisory-only gate would be worth nothing.
      #
      # NB: the task itself HARD-FAILS on an empty golden set and on a missing/unreadable
      # baseline in --fail-on-regression mode. Do not "simplify" either guard away: a run
      # that scores nothing and exits 0 is a false green (the scale-nightly lesson below).
      # Tee the full report (aggregate + per-question winners/losers table) into the job's
      # step summary so a reviewer of a ranking PR sees the delta on the run's summary page
      # without opening the raw log and scrolling. PIPESTATUS preserves the gate's exit
      # code across the tee so a regression still fails the job.
      - name: Run golden-question retrieval eval gate
        run: |
          set -o pipefail
          {
            echo '## Retrieval eval'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mix loopctl.retrieval.eval --mode both --fail-on-regression 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        timeout-minutes: 15

  security:
    name: Security
    runs-on: [self-hosted, beelink]
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          # See lint job: config/*.exs is part of the key so a config-only change
          # (e.g. :exclude_ecto_exceptions_from_plug) forces a clean recompile of
          # config-sensitive deps instead of reusing a stale dep beam.
          key: ${{ runner.os }}-${{ runner.environment }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock', 'config/*.exs') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Run Sobelow
        run: mix sobelow --config

      # Dependency advisory audit via hex.pm's official EEF feed. Local
      # `mix precommit` runs the same check, but it never gated CI — which is how
      # the postgrex/decimal/cowlib advisories of 2026-07 reached master
      # unnoticed. Advisories with no reachable fix are acknowledged via
      # `hex: [ignore_advisories: [...]]` in mix.exs, each justified there. Uses
      # the hex registry fetched by deps.get (no runtime external clone), so a
      # feed-fetch failure fails the build rather than passing the gate empty.
      - name: Audit dependencies
        run: mix hex.audit

  dialyzer:
    name: Dialyzer
    runs-on: [self-hosted, beelink]
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          # See lint job: config/*.exs is part of the key so a config-only change
          # (e.g. :exclude_ecto_exceptions_from_plug) forces a clean recompile of
          # config-sensitive deps instead of reusing a stale dep beam.
          key: ${{ runner.os }}-${{ runner.environment }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock', 'config/*.exs') }}

      # runner.name IS PART OF THE KEY, and it has to be. A PLT embeds ABSOLUTE paths
      # to the OTP install that built it, and every runner has its own _work tree, so
      # a PLT built under runners/loopctl is invalid under runners/loopctl-3:
      #
      #   :dialyzer.run error: File not found:
      #     /home/github-runner/runners/loopctl/_work/_temp/.setup-beam/otp/lib/
      #     dialyzer-5.4.0.1/ebin/erl_bif_types.beam
      #
      # That is not a hypothetical - it is what this job did on its first beelink run,
      # having restored on runner loopctl-3 a PLT saved by runner loopctl.
      #
      # runner.environment was already here and does NOT cover this: it resolves to
      # `self-hosted` on every self-hosted runner, and nuc and beelink even use the
      # SAME directory layout, so the single-runner setup shared a PLT across two
      # machines quite happily. The bug only appears the moment one repo has a second
      # runner, which is exactly what moving here required. home_care_billing hit it
      # first and its ci.yml carries the same fix with the same error quoted.
      #
      # Cost: one PLT per runner, rebuilt once each. The restore-keys prefix is
      # scoped the same way so a stale cross-runner PLT cannot be picked up as a
      # near-miss either - an unscoped prefix would reintroduce the bug on every
      # mix.lock change.
      - name: Restore PLT cache
        uses: actions/cache@v4
        with:
          path: priv/plts/
          key: ${{ runner.os }}-${{ runner.environment }}-${{ runner.name }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.environment }}-${{ runner.name }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run Dialyzer
        run: mix dialyzer

  scale-test:
    name: Scale Tests (US-27.1)
    # Run on push to master and PRs touching scale-related paths, plus nightly
    # schedule. This ensures the scale suite (which commits real rows and runs
    # ANALYZE) is executed in CI and that the DBConnection.OwnershipError or
    # other regressions are caught before they reach production.
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loopctl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          # Include config/*.exs in the key and NO loose restore-keys — a partial-key
          # restore would reuse a _build compiled under the old config, keeping a stale
          # dep beam (phoenix_ecto's Plug.Exception.Postgrex.Error) that collides with our
          # own defimpl and fails `mix compile --warnings-as-errors`. Matches the other jobs.
          key: ${{ runner.os }}-${{ runner.environment }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock', 'config/*.exs') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Create RLS roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'loopctl_app') THEN
                CREATE ROLE loopctl_app LOGIN PASSWORD 'loopctl_app';
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'loopctl_admin') THEN
                CREATE ROLE loopctl_admin LOGIN PASSWORD 'loopctl_admin' BYPASSRLS;
              END IF;
            END \$\$;
          "
          PGPASSWORD=postgres psql -h localhost -U postgres -d loopctl_test -c "
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO loopctl_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO loopctl_app;
            GRANT USAGE, CREATE ON SCHEMA public TO loopctl_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO loopctl_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO loopctl_app;
          "

      - name: Setup database
        run: mix ecto.create && mix ecto.migrate
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/loopctl_test

      - name: Grant RLS roles access to tables
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d loopctl_test -c "
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO loopctl_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO loopctl_app;
          "

      - name: Run scale tests (TC-27.1.1 through TC-27.1.4, AC-27.1.7)
        run: SCALE_TESTS=true mix test --only scale test/loopctl/knowledge/scale_seed_test.exs
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/loopctl_test

      # US-41.1 AC-41.1.12(i) — the per-dimension ANN plan GATE. It EXPLAINs the real
      # request-path inner ANN (BOTH article search and agent-memory recall — each has
      # its own per-dimension index and its own verbatim `::vector(N)` cast) over a
      # committed, ANALYZEd corpus and fails if the per-dimension HNSW index is not the
      # CHOSEN path (no `enable_seqscan = off` anywhere — eligibility is not selection).
      #
      # ON EVERY PR it runs ONE dimension — the hosted default, 1536 — because each
      # dimension seeds ~30k HNSW-indexed article rows PLUS ~30k memory rows, and
      # seeding the whole supported set on every push is not worth the wall clock. The
      # FULL supported set (768 / 1024 / 1536) runs in the scale-nightly matrix, which
      # leaves EMBEDDING_PLAN_GATE_DIMENSIONS unset — so 768 and 1024 keep an AUTOMATIC
      # plan assertion, which now runs only on an explicit pre-merge dispatch.
      # This step is the gate; AC-41.1.12(ii)'s production EXPLAIN is an artifact report,
      # not CI.
      - name: Run per-dimension ANN plan gate (TC-41.1.2, AC-41.1.12(i))
        run: |
          SCALE_TESTS=true mix test --only scale \
            test/loopctl/knowledge/embedding_dimension_plan_scale_test.exs
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/loopctl_test
          EMBEDDING_PLAN_GATE_DIMENSIONS: "1536"

  pgbouncer-e2e:
    name: Pgbouncer e2e (US-27.13)
    # The default Test job connects to DIRECT Postgres, which ACCEPTS a statement_timeout
    # startup parameter — so the US-27.13 outage (pgbouncer rejecting it with 08P01 and
    # crash-looping the HeavyReadRepo pool) was invisible in CI. This job stands up a REAL
    # pgbouncer (transaction pooling) in front of Postgres and runs the :pgbouncer e2e, which
    # reproduces the rejection and proves the SET LOCAL fix enforces through the proxy.
    #
    # This job GATES deploy (deploy `needs:` it). To keep a transient apt/infra hiccup from
    # blocking emergency deploys, the install step retries and the whole job is time-bounded;
    # a genuine RED here (a real pgbouncer-incompatible regression) still blocks deploy. If an
    # apt outage ever blocks an urgent deploy, re-run the job or temporarily detach the gate
    # with sign-off — a test failure and an infra failure are different signals.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.environment }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock', 'config/*.exs') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Create the loopctl_test database (the e2e only needs the DB to exist)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE loopctl_test;"

      - name: Install and start pgbouncer (transaction pooling) in front of Postgres
        run: |
          # Retry the install so a transient apt-mirror hiccup doesn't block a deploy.
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y pgbouncer && break
            echo "apt install attempt $attempt failed; retrying"; sleep 5
          done
          command -v pgbouncer >/dev/null || { echo "pgbouncer install failed after retries"; exit 1; }
          # The apt package enables/starts a default pgbouncer (own /etc/pgbouncer.ini on
          # :6432 with no loopctl_test db). Stop it so OUR instance owns the port.
          sudo systemctl stop pgbouncer 2>/dev/null || true
          printf '"postgres" "postgres"\n' > /tmp/userlist.txt
          cat > /tmp/pgbouncer.ini <<'INI'
          [databases]
          loopctl_test = host=localhost port=5432 dbname=loopctl_test user=postgres password=postgres

          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6432
          auth_type = trust
          auth_file = /tmp/userlist.txt
          pool_mode = transaction
          max_client_conn = 50
          default_pool_size = 10
          pidfile = /tmp/pgbouncer.pid
          logfile = /tmp/pgbouncer.log
          INI
          # `-d` (daemonize) REQUIRES a pidfile (FATAL otherwise).
          pgbouncer -d /tmp/pgbouncer.ini
          # Wait for pgbouncer to accept connections through to Postgres. Fail LOUDLY if it
          # never comes up, so the job reports "pgbouncer never started" rather than a
          # confusing downstream Postgrex error from the test.
          up=""
          for i in $(seq 1 15); do
            if PGPASSWORD=postgres psql "host=127.0.0.1 port=6432 dbname=loopctl_test user=postgres" -tAc "SELECT 1" >/dev/null 2>&1; then
              echo "pgbouncer up"; up=1; break
            fi
            echo "waiting for pgbouncer ($i)"; sleep 1
          done
          if [ -z "$up" ]; then echo "pgbouncer failed to come up"; cat /tmp/pgbouncer.log || true; exit 1; fi

      - name: Run the pgbouncer e2e (reproduces 08P01 + proves the SET LOCAL fix)
        run: mix test --include pgbouncer test/loopctl/pgbouncer_startup_params_test.exs
        env:
          PGBOUNCER_URL: postgres://postgres:postgres@127.0.0.1:6432/loopctl_test

  scale-nightly:
    name: Scale Nightly (${{ matrix.scale_file }})
    # Asserts every heavy endpoint's planner path at PROD_ARTICLE_FLOOR (~80k articles) —
    # the cost-based choices that only appear at production scale.
    # US-27.5 (AC-27.5.3): this is the scale GATE — it covers every :scale_nightly test
    # (HNSW ANN, keyset enumeration, shared plan assertions), not just scale_seed.
    #
    # NO LONGER RUNS ON ANY SCHEDULE — MANUAL DISPATCH ONLY (the "nightly"
    # in the name is kept because the tag, the job and the runbooks all use it). It was a
    # prod-scale PROOF, not a per-night regression watch, and as a NIGHTLY job it stopped
    # paying for itself: 14 matrix jobs, each seeding ~80k committed rows, serially on ONE
    # self-hosted runner — hours of the CI box every night, QUEUED AHEAD of ordinary PR checks,
    # so a routine PR could sit unmergeable behind a scale run nobody asked for.
    # No schedule arm is kept. The trade is stated plainly: most planner/index CHOICE
    # drift arrives with a query/index/corpus change (covered by the pre-merge dispatch),
    # but a Postgres/pgvector upgrade, an ANALYZE shift or a migration that fails to build
    # an HNSW index moves it with NO PR to hang a gate on, and this matrix is the only
    # place any plan-choice assertion runs at the 80k prod floor.
    # Run it deliberately: `gh workflow run CI --ref <branch>`, or per-file locally via
    # docs/runbooks/knowledge_scale_verification.md.
    #
    # MATRIX, one isolated job per scale file: each scale test seeds ~80k COMMITTED
    # (unboxed) rows and cleans up only its own tenant. Running them in one process
    # against one DB lets a leaked corpus (best-effort cleanup) poison the next file's
    # GLOBAL planner stats — a "small tenant in a large corpus" flip that fails
    # assert_hnsw_index, a false RED. Isolation per matrix job is therefore LOAD-BEARING,
    # not tidiness. Adding a :scale_nightly test? Add its file here or it won't gate.
    #
    # This was the single largest GitHub-hosted line item: ~143 min of billed runner
    # time per night across the 14 files, roughly 4,300 min/month, dwarfing every other
    # hosted job combined. Moved self-hosted, and off the nightly cron — see above.
    #
    # The isolation used to come from a FRESH Postgres service container per matrix job.
    # On the self-hosted box there is one long-lived Postgres, so isolation comes from a
    # PER-MATRIX-FILE DATABASE instead (see "Derive this matrix file's database" below).
    # That is equivalent for the property that matters: planner statistics live in the
    # per-database pg_statistic/pg_class, so two databases in one cluster cannot see each
    # other's ANALYZE results any more than two containers could. What a shared cluster
    # DOES share is CPU, shared_buffers and disk — which affects timing, not the plan
    # CHOICE these tests assert on, and the matrix runs serially on one runner anyway.
    runs-on: [self-hosted, beelink]
    # MANUAL DISPATCH, PLUS THE WEEKLY CRON ONLY. Not every-PR (the 80k seed per file is far
    # too slow for every push) and no longer every night. The enforced pre-merge step for a
    # Theme-2/3/4 (query/index) change is `gh workflow run CI --ref <branch>` or the local
    # run in docs/runbooks/knowledge_scale_verification.md.
    #
    # NO schedule arm, deliberately — this matrix does not run on ANY cron. That is the
    # repo owner's decision, not an oversight, and it is the whole point of the change that
    # introduced this condition: 14 jobs x an 80k seed, serially on one self-hosted runner,
    # queued ahead of ordinary PR checks. `test/loopctl/ci_scale_nightly_cron_test.exs`
    # fails the build if a schedule trigger reappears here or a cron is added for it, so
    # re-adding one is a deliberate act with the owner, not a quiet edit.
    #
    # KNOWN CONSEQUENCE, stated rather than hidden: nothing now runs this gate
    # automatically. Drift that no PR touches — a Postgres/pgvector upgrade, an ANALYZE
    # shift, a migration that fails to build an HNSW index — will not be caught until
    # somebody dispatches it. Dispatch it after any such infrastructure change.
    if: github.event_name == 'workflow_dispatch'
    env:
      # scale-nightly derives its own database per matrix file (loopctl_test_sn_<file>)
      # and drops it again at the end, so it never shared a name with anything. What it
      # DID share, once the runners moved back to beelink, is the instance: without
      # these it would create and seed multi-hundred-thousand-row scale databases inside
      # Mark's development Postgres. Both variables are needed -- TEST_DB_PORT for the
      # Ecto repos, PGPORT for the psql steps.
      TEST_DB_PORT: "5433"
      PGPORT: "5433"
    # The derived database is named from the scale FILE alone (loopctl_test_sn_<file>, no
    # run id — a leftover has to name the file that made it, and run_id would push the
    # identifier past Postgres's 63-byte limit). So two runs of the same leg would SHARE
    # one database: two pre-merge dispatches can overlap, and the
    # first leg to finish DROPs ... WITH (FORCE), killing the other's connections mid-seed
    # for a false RED. Serialise per file rather than cancel — the queued run is usually
    # the one a human is waiting on.
    concurrency:
      group: scale-nightly-${{ matrix.scale_file }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # US-41.1 AC-41.1.12(i): embedding_dimension_plan_scale_test.exs is listed here
        # for the FULL supported-dimension matrix (768/1024/1536, article + memory). The
        # every-PR job runs the same file with EMBEDDING_PLAN_GATE_DIMENSIONS=1536, so
        # 1024 gets its real plan assertion here rather than an index-existence check.
        # NB: the runbook guard parses the list items below by `take_while` — do NOT put
        # a comment between `scale_file:` and its items, or entries after it go unseen.
        scale_file:
          - test/loopctl/knowledge/scale_seed_nightly_test.exs
          - test/loopctl/knowledge/vector_search_scale_test.exs
          - test/loopctl/knowledge/vector_search_under_fill_scale_test.exs
          - test/loopctl/knowledge/topk_endpoints_scale_test.exs
          - test/loopctl/knowledge/plan_assertions_scale_test.exs
          - test/loopctl/knowledge/keyset_plan_scale_test.exs
          - test/loopctl/knowledge/by_source_change_feed_plan_scale_test.exs
          - test/loopctl/knowledge/streaming_export_scale_test.exs
          - test/loopctl/knowledge/distant_pairs_novelty_scale_test.exs
          - test/loopctl/knowledge/cosine_lint_vs_scale_gate_scale_test.exs
          - test/loopctl/knowledge/scale_calibration_mismatch_scale_test.exs
          - test/loopctl/knowledge/vector_endpoint_e2e_latency_scale_test.exs
          - test/loopctl/knowledge/remediation_matrix_scale_test.exs
          - test/loopctl/knowledge/embedding_dimension_plan_scale_test.exs
    # NO `services:` block on self-hosted. nuc already runs a long-lived Postgres 16
    # bound to 127.0.0.1:5432, so a service container declaring 5432:5432 cannot bind and
    # the job dies at "Initialize containers" before its first step. That host instance
    # has pgvector 0.8.2 available, which is what the pgvector/pgvector:pg16 image was
    # supplying, so the image is not needed — only its port was ever in the way.
    steps:
      - uses: actions/checkout@v4

      # Isolation, replacing the per-job fresh container (see the note on `runs-on`).
      #
      # config/test.exs builds the database name as "loopctl_test" <> MIX_TEST_PARTITION,
      # so setting that variable is the supported way to move a run onto its own database
      # for all three repos (Repo, AdminRepo, HeavyReadRepo) at once.
      #
      # It is safe to put a NON-INTEGER here only because this job selects tests with
      # `--only scale_nightly` and never passes `mix test --partitions N`. Under
      # `--partitions`, Mix validates MIX_TEST_PARTITION as an integer in 1..N and aborts
      # on anything else — which is why home_care_billing needed a separate TEST_DB_BASE
      # variable and this job does not.
      #
      # Derived from the file name rather than a bare index so a leftover database names
      # the file that made it. Longest result is 40 chars, well inside Postgres's 63-byte
      # identifier limit.
      # Sanitised with bash parameter expansion rather than `basename ... | tr`: piping into
      # tr feeds it basename's trailing NEWLINE, which is itself a non-alphanumeric byte and
      # so becomes a trailing underscore in the database name. Verified — the first run of
      # this produced loopctl_test_sn_scale_calibration_mismatch_scale_test_ with the stray
      # underscore. Expansion operates on the already-stripped substitution result.
      - name: Derive this matrix file's database
        run: |
          set -euo pipefail
          suffix=$(basename '${{ matrix.scale_file }}' .exs)
          suffix=${suffix//[^a-zA-Z0-9]/_}
          echo "MIX_TEST_PARTITION=_sn_${suffix}" >> "$GITHUB_ENV"
          echo "SCALE_DB=loopctl_test_sn_${suffix}" >> "$GITHUB_ENV"
          echo "This job's database: loopctl_test_sn_${suffix} (${#suffix} char suffix)"

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          # Include config/*.exs in the key and NO loose restore-keys — a partial-key
          # restore would reuse a _build compiled under the old config, keeping a stale
          # dep beam (phoenix_ecto's Plug.Exception.Postgrex.Error) that collides with our
          # own defimpl and fails `mix compile --warnings-as-errors`. Matches the other jobs.
          key: ${{ runner.os }}-${{ runner.environment }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock', 'config/*.exs') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Create RLS roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'loopctl_app') THEN
                CREATE ROLE loopctl_app LOGIN PASSWORD 'loopctl_app';
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'loopctl_admin') THEN
                CREATE ROLE loopctl_admin LOGIN PASSWORD 'loopctl_admin' BYPASSRLS;
              END IF;
            END \$\$;
          "

      # ORDER IS LOAD-BEARING, and it differs from the hosted version this replaced.
      #
      # The service container pre-created its database via POSTGRES_DB, so the old job
      # could grant on that database before ever running ecto.create. Here the
      # per-matrix-file database does not exist until ecto.create makes it, so granting
      # first would fail with "database does not exist". Hence create, grant, migrate.
      #
      # ALTER DEFAULT PRIVILEGES must still land BETWEEN create and migrate: it applies
      # only to tables created AFTER it runs, so deferring it until after ecto.migrate
      # would leave every migrated table ungranted and fail the RLS tests for a reason
      # that reads like a policy bug rather than a privilege one.
      - name: Create this job's database
        run: mix ecto.create

      - name: Grant RLS roles on the schema, before any table exists
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d "$SCALE_DB" -c "
            GRANT USAGE, CREATE ON SCHEMA public TO loopctl_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO loopctl_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO loopctl_app;
          "

      - name: Migrate
        run: mix ecto.migrate

      # Belt and braces over ALTER DEFAULT PRIVILEGES above, which should already cover
      # every table the migrations created.
      - name: Grant RLS roles access to tables
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d "$SCALE_DB" -c "
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO loopctl_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO loopctl_app;
          "

      # US-27.5 (AC-27.5.3): the scale GATE. Each matrix job runs ONE :scale_nightly
      # file against its own fresh ~80k prod-floor corpus. Across the matrix this
      # exercises the vector ANN, enumeration/keyset, and shared plan assertions at
      # scale — they were tagged :scale_nightly but no CI job ran them before this.
      # The file list lives in strategy.matrix.scale_file (above); the runbook test
      # (scale_verification_runbook_test.exs) guards that every :scale_nightly file is
      # listed there, so gate coverage cannot silently erode.
      #
      # NB: `--only scale_nightly` is the SOLE test selector here. The env vars are NOT
      # load-bearing for selection (they gate the SCALE_NIGHTLY exclude in test_helper,
      # but `--only` overrides the exclude regardless). Do NOT "simplify" by dropping
      # `--only` and trusting the env: without it the normal suite runs and exits 0 — a
      # false-green where the gate silently never ran.
      #
      # No DATABASE_URL here (the hosted version set one). config/runtime.exs reads that
      # variable only inside `if config_env() == :prod`, so in MIX_ENV=test it was dead
      # config that merely LOOKED like it chose the database — config/test.exs does, from
      # MIX_TEST_PARTITION. Leaving it in place next to a per-matrix-file database would
      # actively mislead the next reader about which one wins.
      - name: Run nightly scale gate (US-27.1 prod-floor + US-27.2 plan assertions at scale)
        run: SCALE_TESTS=true SCALE_NIGHTLY=true mix test --only scale_nightly ${{ matrix.scale_file }}
        # 45 > the per-test ExUnit `@moduletag timeout: 30 min`, so ExUnit's timer always
        # binds first and a slow run fails with a legible test error, not an opaque
        # GitHub step cancel. One 80k seed + assertions; the old 45 covered all four.
        timeout-minutes: 45

      # The disposable service container used to make cleanup free. On a long-lived
      # Postgres it is mandatory: each of these databases holds an ~80k-article
      # prod-floor corpus with its vectors and HNSW index. Observed live during the first
      # beelink run (24 cores, pre-2026-08-07): 1345 MB for remediation_matrix alone (they vary widely — the
      # calibration file needs only ~14 MB). A full matrix left un-dropped is therefore
      # on the order of 10 GB added to the box PER FULL RUN until it filled.
      #
      # `if: always()` so a failed or cancelled gate still reclaims its space — an
      # abandoned corpus is exactly what a timed-out 40-minute seed leaves behind.
      #
      # WITH (FORCE) terminates any connection still attached (Postgres 13+); without it
      # a lingering pool connection makes DROP fail with "database is being accessed by
      # other users" and the space is never reclaimed.
      #
      # A failed drop is REPORTED AND SWALLOWED on a dispatch, where the person who fired
      # the run is reading the log — cleanup must not redden a gate they are watching. On
      # an unattended run nobody watches: a warning there is read by no one, and
      # the orphaned corpus (1345 MB observed for remediation_matrix) accumulates every
      # week until the box fills. So the schedule arm FAILS instead.
      - name: Drop this job's database
        if: always()
        run: |
          if [ -z "${SCALE_DB:-}" ]; then
            echo "::warning::SCALE_DB unset (the derive step never ran) — nothing to drop."
            exit 0
          fi
          if PGPASSWORD=postgres psql -h localhost -U postgres -c \
               "DROP DATABASE IF EXISTS \"$SCALE_DB\" WITH (FORCE);"; then
            echo "Dropped $SCALE_DB."
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::error::could not drop $SCALE_DB on an unattended run — reclaim it by hand."
            exit 1
          else
            echo "::warning::could not drop $SCALE_DB — reclaim it by hand."
          fi

  # --- Pre-deploy smoke (#652) -------------------------------------------------
  #
  # Runs the SAME scripts/smoke.sh against the CURRENTLY-LIVE release, on every PR and
  # every master push, BEFORE deploy. It exists because the post-deploy smoke below can
  # only ever tell you something is wrong AFTER the bad release is serving traffic —
  # "we find out late" — and, running only on master push, it can never report on a PR
  # head SHA, so it CANNOT be made a required branch-protection check without
  # deadlocking every merge (a required check that never runs on the PR blocks it
  # forever). This job can, because it runs on pull_request.
  #
  # BE CLEAR ABOUT WHAT IT PROVES. It probes the release already in production, NOT the
  # code in the PR, so it does not validate your diff. What it does catch, at PR time
  # instead of post-deploy:
  #   * production is ALREADY broken — do not deploy on top of it;
  #   * scripts/smoke.sh itself is broken, or its key/secret has expired or lost the
  #     privileges the checks need — the detector failing silently is how you end up
  #     trusting a green that means nothing;
  #   * the runner cannot reach the app at all, which is exactly the 2026-08-11 failure
  #     (8/8 checks at HTTP 000 against a demonstrably healthy release).
  #
  # It does NOT need the deploy credentials — read-only probes with a low-privilege key.
  smoke-preflight:
    name: Pre-deploy Smoke (current release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run smoke against the live release
        env:
          BASE_URL: https://loopctl.com
          LOOPCTL_SMOKE_KEY: ${{ secrets.LOOPCTL_SMOKE_KEY }}
        run: bash scripts/smoke.sh

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # pgbouncer-e2e gates deploy (US-27.13): it is the only check that exercises the pgbouncer
    # layer, so a reintroduced pgbouncer-incompatible config must block the deploy, not just
    # go red advisorily.
    needs: [lint, test, security, dialyzer, pgbouncer-e2e, retrieval-eval, smoke-preflight]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  smoke:
    name: Post-deploy Smoke
    runs-on: ubuntu-latest
    # Runs AFTER the Fly deploy so it validates the freshly-deployed release, not
    # the old one. It does NOT gate anything (deploy already happened) — it is a
    # DETECTOR: a smoke failure turns the run RED so the operator knows to roll
    # back (see docs/runbooks/post-deploy-smoke.md). Only on a real master push;
    # never on PRs (no live release to probe) or the nightly schedule.
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # LOOPCTL_SMOKE_KEY MUST be a LOW-PRIVILEGE READ key (agent role is enough):
      # smoke.sh issues only read-only requests, and CI secrets should carry the
      # least privilege that satisfies the checks. The secret goes in `env:` (not
      # inline on `run:`) as the safe pattern against a future `set -x`.
      - name: Run post-deploy smoke
        env:
          BASE_URL: https://loopctl.com
          LOOPCTL_SMOKE_KEY: ${{ secrets.LOOPCTL_SMOKE_KEY }}
        run: bash scripts/smoke.sh
