name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Nightly at 02:00 UTC — runs scale-nightly job (TC-27.1.5, prod-floor HNSW plan check)
    - cron: "0 2 * * *"

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "28.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          # Key on config/*.exs too: deps like phoenix_ecto read parent-app
          # config (e.g. :exclude_ecto_exceptions_from_plug) at THEIR compile
          # time, but a config-only change does not mark the dep stale. Without
          # this, a restored _build can keep a stale dep beam that collides with
          # our own defimpl and fails `mix compile --warnings-as-errors`. No loose
          # restore-keys for the same reason — a config change must not silently
          # reuse a _build compiled under the old config.
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock', 'config/*.exs') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check unused dependencies
        run: mix deps.unlock --check-unused

      - name: Run Credo
        run: mix credo --strict

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loopctl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          # See lint job: config/*.exs is part of the key so a config-only change
          # (e.g. :exclude_ecto_exceptions_from_plug) forces a clean recompile of
          # config-sensitive deps instead of reusing a stale dep beam.
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock', 'config/*.exs') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Create RLS roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'loopctl_app') THEN
                CREATE ROLE loopctl_app LOGIN PASSWORD 'loopctl_app';
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'loopctl_admin') THEN
                CREATE ROLE loopctl_admin LOGIN PASSWORD 'loopctl_admin' BYPASSRLS;
              END IF;
            END \$\$;
          "
          PGPASSWORD=postgres psql -h localhost -U postgres -d loopctl_test -c "
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO loopctl_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO loopctl_app;
            GRANT USAGE, CREATE ON SCHEMA public TO loopctl_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO loopctl_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO loopctl_app;
          "

      - name: Setup database
        run: mix ecto.create && mix ecto.migrate
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/loopctl_test

      - name: Grant RLS roles access to tables
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d loopctl_test -c "
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO loopctl_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO loopctl_app;
          "

      - name: Run tests
        run: mix test
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/loopctl_test

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          # See lint job: config/*.exs is part of the key so a config-only change
          # (e.g. :exclude_ecto_exceptions_from_plug) forces a clean recompile of
          # config-sensitive deps instead of reusing a stale dep beam.
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock', 'config/*.exs') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Run Sobelow
        run: mix sobelow --config

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          # See lint job: config/*.exs is part of the key so a config-only change
          # (e.g. :exclude_ecto_exceptions_from_plug) forces a clean recompile of
          # config-sensitive deps instead of reusing a stale dep beam.
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock', 'config/*.exs') }}

      - name: Restore PLT cache
        uses: actions/cache@v4
        with:
          path: priv/plts/
          key: ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run Dialyzer
        run: mix dialyzer

  scale-test:
    name: Scale Tests (US-27.1)
    # Run on push to master and PRs touching scale-related paths, plus nightly
    # schedule. This ensures the scale suite (which commits real rows and runs
    # ANALYZE) is executed in CI and that the DBConnection.OwnershipError or
    # other regressions are caught before they reach production.
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loopctl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          # Include config/*.exs in the key and NO loose restore-keys — a partial-key
          # restore would reuse a _build compiled under the old config, keeping a stale
          # dep beam (phoenix_ecto's Plug.Exception.Postgrex.Error) that collides with our
          # own defimpl and fails `mix compile --warnings-as-errors`. Matches the other jobs.
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock', 'config/*.exs') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Create RLS roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'loopctl_app') THEN
                CREATE ROLE loopctl_app LOGIN PASSWORD 'loopctl_app';
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'loopctl_admin') THEN
                CREATE ROLE loopctl_admin LOGIN PASSWORD 'loopctl_admin' BYPASSRLS;
              END IF;
            END \$\$;
          "
          PGPASSWORD=postgres psql -h localhost -U postgres -d loopctl_test -c "
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO loopctl_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO loopctl_app;
            GRANT USAGE, CREATE ON SCHEMA public TO loopctl_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO loopctl_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO loopctl_app;
          "

      - name: Setup database
        run: mix ecto.create && mix ecto.migrate
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/loopctl_test

      - name: Grant RLS roles access to tables
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d loopctl_test -c "
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO loopctl_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO loopctl_app;
          "

      - name: Run scale tests (TC-27.1.1 through TC-27.1.4, AC-27.1.7)
        run: SCALE_TESTS=true mix test --only scale test/loopctl/knowledge/scale_seed_test.exs
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/loopctl_test

  scale-nightly:
    name: Scale Nightly (prod-floor plan gate — US-27.1/27.2/27.5)
    # Runs nightly to assert every heavy endpoint's planner path at PROD_ARTICLE_FLOOR
    # (~80k articles) — the cost-based choices that only appear at production scale.
    # US-27.5 (AC-27.5.3): this is the scale GATE — it runs ALL :scale_nightly tests
    # (HNSW ANN, keyset enumeration, shared plan assertions), not just scale_seed.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loopctl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          # Include config/*.exs in the key and NO loose restore-keys — a partial-key
          # restore would reuse a _build compiled under the old config, keeping a stale
          # dep beam (phoenix_ecto's Plug.Exception.Postgrex.Error) that collides with our
          # own defimpl and fails `mix compile --warnings-as-errors`. Matches the other jobs.
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock', 'config/*.exs') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Create RLS roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'loopctl_app') THEN
                CREATE ROLE loopctl_app LOGIN PASSWORD 'loopctl_app';
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'loopctl_admin') THEN
                CREATE ROLE loopctl_admin LOGIN PASSWORD 'loopctl_admin' BYPASSRLS;
              END IF;
            END \$\$;
          "
          PGPASSWORD=postgres psql -h localhost -U postgres -d loopctl_test -c "
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO loopctl_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO loopctl_app;
            GRANT USAGE, CREATE ON SCHEMA public TO loopctl_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO loopctl_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO loopctl_app;
          "

      - name: Setup database
        run: mix ecto.create && mix ecto.migrate
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/loopctl_test

      - name: Grant RLS roles access to tables
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d loopctl_test -c "
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO loopctl_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO loopctl_app;
          "

      # US-27.5 (AC-27.5.3): the scale GATE runs EVERY :scale_nightly test against the
      # ~80k prod-floor corpus — not just scale_seed_nightly. This is what makes the
      # vector ANN, enumeration/keyset, and shared plan assertions actually execute at
      # scale (they were tagged :scale_nightly but no CI job ran them before this). No
      # path filter: `--only scale_nightly` picks them all up across the suite.
      - name: Run nightly scale gate (US-27.1 prod-floor + US-27.2 plan assertions at scale)
        run: SCALE_TESTS=true SCALE_NIGHTLY=true mix test --only scale_nightly
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/loopctl_test
        timeout-minutes: 45

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [lint, test, security, dialyzer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
