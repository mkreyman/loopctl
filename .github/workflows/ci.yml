name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Nightly at 02:00 UTC — runs scale-nightly job (TC-27.1.5, prod-floor HNSW plan check)
    - cron: "0 2 * * *"
  # Manual trigger so the (otherwise schedule-only) scale-nightly matrix can be RUN and
  # validated on a branch BEFORE merge — `gh workflow run CI --ref <branch>` (US-27.5).
  # Without this the matrix change is never exercised by its own PR.
  workflow_dispatch:

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "28.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          # Key on config/*.exs too: deps like phoenix_ecto read parent-app
          # config (e.g. :exclude_ecto_exceptions_from_plug) at THEIR compile
          # time, but a config-only change does not mark the dep stale. Without
          # this, a restored _build can keep a stale dep beam that collides with
          # our own defimpl and fails `mix compile --warnings-as-errors`. No loose
          # restore-keys for the same reason — a config change must not silently
          # reuse a _build compiled under the old config.
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock', 'config/*.exs') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check unused dependencies
        run: mix deps.unlock --check-unused

      - name: Run Credo
        run: mix credo --strict

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loopctl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          # See lint job: config/*.exs is part of the key so a config-only change
          # (e.g. :exclude_ecto_exceptions_from_plug) forces a clean recompile of
          # config-sensitive deps instead of reusing a stale dep beam.
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock', 'config/*.exs') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Create RLS roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'loopctl_app') THEN
                CREATE ROLE loopctl_app LOGIN PASSWORD 'loopctl_app';
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'loopctl_admin') THEN
                CREATE ROLE loopctl_admin LOGIN PASSWORD 'loopctl_admin' BYPASSRLS;
              END IF;
            END \$\$;
          "
          PGPASSWORD=postgres psql -h localhost -U postgres -d loopctl_test -c "
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO loopctl_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO loopctl_app;
            GRANT USAGE, CREATE ON SCHEMA public TO loopctl_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO loopctl_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO loopctl_app;
          "

      - name: Setup database
        run: mix ecto.create && mix ecto.migrate
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/loopctl_test

      - name: Grant RLS roles access to tables
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d loopctl_test -c "
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO loopctl_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO loopctl_app;
          "

      - name: Run tests
        run: mix test
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/loopctl_test

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          # See lint job: config/*.exs is part of the key so a config-only change
          # (e.g. :exclude_ecto_exceptions_from_plug) forces a clean recompile of
          # config-sensitive deps instead of reusing a stale dep beam.
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock', 'config/*.exs') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Run Sobelow
        run: mix sobelow --config

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          # See lint job: config/*.exs is part of the key so a config-only change
          # (e.g. :exclude_ecto_exceptions_from_plug) forces a clean recompile of
          # config-sensitive deps instead of reusing a stale dep beam.
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock', 'config/*.exs') }}

      - name: Restore PLT cache
        uses: actions/cache@v4
        with:
          path: priv/plts/
          key: ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run Dialyzer
        run: mix dialyzer

  scale-test:
    name: Scale Tests (US-27.1)
    # Run on push to master and PRs touching scale-related paths, plus nightly
    # schedule. This ensures the scale suite (which commits real rows and runs
    # ANALYZE) is executed in CI and that the DBConnection.OwnershipError or
    # other regressions are caught before they reach production.
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loopctl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          # Include config/*.exs in the key and NO loose restore-keys — a partial-key
          # restore would reuse a _build compiled under the old config, keeping a stale
          # dep beam (phoenix_ecto's Plug.Exception.Postgrex.Error) that collides with our
          # own defimpl and fails `mix compile --warnings-as-errors`. Matches the other jobs.
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock', 'config/*.exs') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Create RLS roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'loopctl_app') THEN
                CREATE ROLE loopctl_app LOGIN PASSWORD 'loopctl_app';
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'loopctl_admin') THEN
                CREATE ROLE loopctl_admin LOGIN PASSWORD 'loopctl_admin' BYPASSRLS;
              END IF;
            END \$\$;
          "
          PGPASSWORD=postgres psql -h localhost -U postgres -d loopctl_test -c "
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO loopctl_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO loopctl_app;
            GRANT USAGE, CREATE ON SCHEMA public TO loopctl_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO loopctl_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO loopctl_app;
          "

      - name: Setup database
        run: mix ecto.create && mix ecto.migrate
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/loopctl_test

      - name: Grant RLS roles access to tables
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d loopctl_test -c "
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO loopctl_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO loopctl_app;
          "

      - name: Run scale tests (TC-27.1.1 through TC-27.1.4, AC-27.1.7)
        run: SCALE_TESTS=true mix test --only scale test/loopctl/knowledge/scale_seed_test.exs
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/loopctl_test

  pgbouncer-e2e:
    name: Pgbouncer e2e (US-27.13)
    # The default Test job connects to DIRECT Postgres, which ACCEPTS a statement_timeout
    # startup parameter — so the US-27.13 outage (pgbouncer rejecting it with 08P01 and
    # crash-looping the HeavyReadRepo pool) was invisible in CI. This job stands up a REAL
    # pgbouncer (transaction pooling) in front of Postgres and runs the :pgbouncer e2e, which
    # reproduces the rejection and proves the SET LOCAL fix enforces through the proxy.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock', 'config/*.exs') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Create the loopctl_test database (the e2e only needs the DB to exist)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE loopctl_test;"

      - name: Install and start pgbouncer (transaction pooling) in front of Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y pgbouncer
          # The apt package enables/starts a default pgbouncer (own /etc/pgbouncer.ini on
          # :6432 with no loopctl_test db). Stop it so OUR instance owns the port.
          sudo systemctl stop pgbouncer 2>/dev/null || true
          printf '"postgres" "postgres"\n' > /tmp/userlist.txt
          cat > /tmp/pgbouncer.ini <<'INI'
          [databases]
          loopctl_test = host=localhost port=5432 dbname=loopctl_test user=postgres password=postgres

          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6432
          auth_type = trust
          auth_file = /tmp/userlist.txt
          pool_mode = transaction
          max_client_conn = 50
          default_pool_size = 10
          pidfile = /tmp/pgbouncer.pid
          logfile = /tmp/pgbouncer.log
          INI
          # `-d` (daemonize) REQUIRES a pidfile (FATAL otherwise).
          pgbouncer -d /tmp/pgbouncer.ini
          # Wait for pgbouncer to accept connections through to Postgres. Fail LOUDLY if it
          # never comes up, so the job reports "pgbouncer never started" rather than a
          # confusing downstream Postgrex error from the test.
          up=""
          for i in $(seq 1 15); do
            if PGPASSWORD=postgres psql "host=127.0.0.1 port=6432 dbname=loopctl_test user=postgres" -tAc "SELECT 1" >/dev/null 2>&1; then
              echo "pgbouncer up"; up=1; break
            fi
            echo "waiting for pgbouncer ($i)"; sleep 1
          done
          if [ -z "$up" ]; then echo "pgbouncer failed to come up"; cat /tmp/pgbouncer.log || true; exit 1; fi

      - name: Run the pgbouncer e2e (reproduces 08P01 + proves the SET LOCAL fix)
        run: mix test --include pgbouncer test/loopctl/pgbouncer_startup_params_test.exs
        env:
          PGBOUNCER_URL: postgres://postgres:postgres@127.0.0.1:6432/loopctl_test

  scale-nightly:
    name: Scale Nightly (${{ matrix.scale_file }})
    # Runs nightly to assert every heavy endpoint's planner path at PROD_ARTICLE_FLOOR
    # (~80k articles) — the cost-based choices that only appear at production scale.
    # US-27.5 (AC-27.5.3): this is the scale GATE — it runs every :scale_nightly test
    # (HNSW ANN, keyset enumeration, shared plan assertions), not just scale_seed.
    #
    # MATRIX, one isolated job per scale file: each scale test seeds ~80k COMMITTED
    # (unboxed) rows and cleans up only its own tenant. Running them in one process
    # against one DB lets a leaked corpus (best-effort cleanup) poison the next file's
    # GLOBAL planner stats — a "small tenant in a large corpus" flip that fails
    # assert_hnsw_index, a false RED. A matrix gives each file a FRESH Postgres service,
    # so cross-file pollution is impossible by construction, and wall-clock is max(file)
    # not sum(files). Adding a :scale_nightly test? Add its file here or it won't gate.
    runs-on: ubuntu-latest
    # Schedule (nightly) OR manual dispatch (pre-merge validation on a branch). Not
    # every-PR: the 4×80k seed is too slow for every push, so the enforced pre-merge
    # step for a Theme-2/3/4 (query/index) change is `gh workflow run CI --ref <branch>`
    # or the local run in docs/runbooks/knowledge_scale_verification.md.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        scale_file:
          - test/loopctl/knowledge/scale_seed_nightly_test.exs
          - test/loopctl/knowledge/vector_search_scale_test.exs
          - test/loopctl/knowledge/vector_search_under_fill_scale_test.exs
          - test/loopctl/knowledge/topk_endpoints_scale_test.exs
          - test/loopctl/knowledge/plan_assertions_scale_test.exs
          - test/loopctl/knowledge/keyset_plan_scale_test.exs
          - test/loopctl/knowledge/by_source_change_feed_plan_scale_test.exs
          - test/loopctl/knowledge/streaming_export_scale_test.exs
          - test/loopctl/knowledge/distant_pairs_novelty_scale_test.exs
          - test/loopctl/knowledge/cosine_lint_vs_scale_gate_scale_test.exs
          - test/loopctl/knowledge/scale_calibration_mismatch_scale_test.exs
          - test/loopctl/knowledge/vector_endpoint_e2e_latency_scale_test.exs
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loopctl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          # Include config/*.exs in the key and NO loose restore-keys — a partial-key
          # restore would reuse a _build compiled under the old config, keeping a stale
          # dep beam (phoenix_ecto's Plug.Exception.Postgrex.Error) that collides with our
          # own defimpl and fails `mix compile --warnings-as-errors`. Matches the other jobs.
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock', 'config/*.exs') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Create RLS roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'loopctl_app') THEN
                CREATE ROLE loopctl_app LOGIN PASSWORD 'loopctl_app';
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'loopctl_admin') THEN
                CREATE ROLE loopctl_admin LOGIN PASSWORD 'loopctl_admin' BYPASSRLS;
              END IF;
            END \$\$;
          "
          PGPASSWORD=postgres psql -h localhost -U postgres -d loopctl_test -c "
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO loopctl_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO loopctl_app;
            GRANT USAGE, CREATE ON SCHEMA public TO loopctl_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO loopctl_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO loopctl_app;
          "

      - name: Setup database
        run: mix ecto.create && mix ecto.migrate
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/loopctl_test

      - name: Grant RLS roles access to tables
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d loopctl_test -c "
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO loopctl_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO loopctl_app;
          "

      # US-27.5 (AC-27.5.3): the scale GATE. Each matrix job runs ONE :scale_nightly
      # file against its own fresh ~80k prod-floor corpus. Across the matrix this
      # exercises the vector ANN, enumeration/keyset, and shared plan assertions at
      # scale — they were tagged :scale_nightly but no CI job ran them before this.
      # The file list lives in strategy.matrix.scale_file (above); the runbook test
      # (scale_verification_runbook_test.exs) guards that every :scale_nightly file is
      # listed there, so gate coverage cannot silently erode.
      #
      # NB: `--only scale_nightly` is the SOLE test selector here. The env vars are NOT
      # load-bearing for selection (they gate the SCALE_NIGHTLY exclude in test_helper,
      # but `--only` overrides the exclude regardless). Do NOT "simplify" by dropping
      # `--only` and trusting the env: without it the normal suite runs and exits 0 — a
      # false-green where the gate silently never ran.
      - name: Run nightly scale gate (US-27.1 prod-floor + US-27.2 plan assertions at scale)
        run: SCALE_TESTS=true SCALE_NIGHTLY=true mix test --only scale_nightly ${{ matrix.scale_file }}
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/loopctl_test
        # 45 > the per-test ExUnit `@moduletag timeout: 30 min`, so ExUnit's timer always
        # binds first and a slow run fails with a legible test error, not an opaque
        # GitHub step cancel. One 80k seed + assertions; the old 45 covered all four.
        timeout-minutes: 45

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # pgbouncer-e2e gates deploy (US-27.13): it is the only check that exercises the pgbouncer
    # layer, so a reintroduced pgbouncer-incompatible config must block the deploy, not just
    # go red advisorily.
    needs: [lint, test, security, dialyzer, pgbouncer-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
