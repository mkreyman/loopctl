# Fly.io deployment configuration for loopctl
# See https://fly.io/docs/reference/configuration/

app = "loopctl"
primary_region = "lax"

# Issue #815: Fly's default kill signal is SIGINT, which drops the BEAM into its break
# handler — no application stop, no socket drain, nothing logged about the runner sockets.
# SIGTERM runs a graceful stop: the Endpoint drains its sockets (runner channels push
# `disconnecting` / `server_shutdown` first), then Bandit and Oban wind down.
#
# `kill_timeout` must outlast that whole stop, or Fly SIGKILLs it half way. The window
# (the drainers set explicitly, the rest at their defaults), held by
# test/loopctl/fly_toml_test.exs:
#   socket drainers  30 s (/live) + 10 s (/runner/socket)  — lib/loopctl_web/endpoint.ex
#   Bandit            15 s  (ThousandIsland shutdown_timeout default)
#   Oban              15 s  (shutdown_grace_period default)
#   = 70 s, so 90 s leaves 20 s of margin.
kill_signal = "SIGTERM"
kill_timeout = 90

[build]
  [build.args]
    MIX_ENV = "prod"

[deploy]
  release_command = "/app/bin/migrate"
  # Pin rolling (one machine replaced at a time) so the DB connection budget in
  # Loopctl.DbCapacity holds. Switching to "bluegreen" doubles the fleet's connections
  # transiently and would blow the max_connections budget — re-derive it first.
  strategy = "rolling"

[env]
  PHX_HOST = "loopctl.com"
  PORT = "8080"
  PHX_SERVER = "true"
  # #376: alerting is OFF until an operator webhook receiver exists. OFF means OFF, not
  # log-only: LoopctlWeb.Telemetry.scale_alerts_children/0 omits the ScaleAlerts child
  # entirely, so no telemetry handlers are attached, no threshold is evaluated and no
  # breach is logged. The Prometheus series (ScaleMetrics, the [metrics] port below) are
  # unaffected and remain the degradation signal while this is "false". Delete this line
  # (or set "true") in the SAME change that sets the SCALE_ALERT_WEBHOOK_URL secret —
  # ScaleAlerts.config_status/2 flags BOTH half-done directions, so doing one without the
  # other turns /health/ready red with a reason naming the setting to fix.
  SCALE_ALERTS_ENABLED = "false"

  # #803: THE UNATTENDED DISPATCH DRIVER IS ON. Enabled 2026-09-16 on Mark's
  # instruction ("enable the loop. Let it succeed or fail on the next filed issue"),
  # after the intake-source MCP tools made the loop wireable at all. With this true
  # and DISPATCH_WALL_CLOCK_SECONDS and DISPATCH_MAX_TURNS set, DispatchDriverWorker
  # places queued stories on whichever runner has slots free, with nobody watching.
  #
  # TWO KEYS GATE THE IMPLEMENT DRIVER, NOT FOUR. DispatchDriver.budgets/0
  # (dispatch_driver.ex:236-241) reads only :dispatch_wall_clock_seconds and
  # :dispatch_max_turns; the TRIAGE pair below gates TriageDispatcher and nothing else.
  # Debugging "the driver placed nothing"? Check those two. And do not read an unset
  # triage pair as the implement driver being safely off — it is not one of its gates.
  #
  # THE OFF SWITCH IS A DEPLOY, and only a deploy: `fly deploy -a loopctl` with this line
  # set to "false". config/runtime.exs reads the variable at BOOT, so nothing picks up a
  # change until every machine restarts, and [deploy] strategy is "rolling" — the machine
  # still running the old release keeps placing stories until it is replaced. Budget for
  # placements during the rollout; this is not an instant stop.
  #
  # DO NOT reach for `fly secrets set DISPATCH_DRIVER_ENABLED=false`. It is faster and it
  # is a trap: a Fly secret OUTRANKS this [env] line and PERSISTS, so the driver stays off
  # afterwards no matter what is written here, and a later deploy that means to turn it
  # back on silently does nothing. Recovering needs `fly secrets unset
  # DISPATCH_DRIVER_ENABLED`, which is another restart. If an incident genuinely needs the
  # secret, record that it was set — the next operator reads this file, not the secret list.
  DISPATCH_DRIVER_ENABLED = "true"

  # THE BUDGETS ARE A COST POLICY, not a timeout, and they have no defaults on purpose
  # (config/runtime.exs:177) — a default would be our guess quietly becoming Mark's
  # spend. Lower them to cap harder; raise them only with a measured run that needed it.
  # Two measured runs set them:
  #  - 2026-09-14, one story, no PR route: 28.8 minutes, 108 turns (~3.75 a minute), about
  #    USD 10.40. That set 3600 s / 200 turns, ~2x the run.
  #  - 2026-11-07, the first pr-route run on home_care_billing (story ddb4fcc1, HCB #3922):
  #    the fix was committed in 21 minutes, then the rest of the hour went to HCB's pre-push
  #    gate and the session was killed at 3600 s mid-push, before its PR existed. A pr-route
  #    run also carries the review, CI (~10 minutes) and the merge.
  # So 7200 s, and turns raised with it at the measured rate (two hours at ~3.75 a minute
  # is ~450; 400 keeps the pair bounded together). A runaway is capped near two hours and
  # about USD 40. Mark's to lower.
  DISPATCH_WALL_CLOCK_SECONDS = "7200"
  DISPATCH_MAX_TURNS = "400"

  # THE FLEET MULTIPLIER. The two budgets above bound ONE session; what we actually spend is
  # that times how many run at once, so the multiplier belongs next to the multiplicand or
  # the block states half a cost policy. This is the TENANT-WIDE admission cap
  # (config/runtime.exs:161-168 -> Loopctl.Runners.Capacity.limit/0 at capacity.ex:223,
  # code default 6).
  #
  # IT IS AN UPPER BOUND AND USUALLY NOT THE BINDING ONE. Capacity.reserve/3 also gates per
  # runner on `in_flight < max_sessions`, and max_sessions follows each runner's OWN
  # enrolment declaration — loopctl derives it and never stores an independent copy
  # (KB 8dff6636) — so the real ceiling on concurrent unattended sessions is
  #
  #     min(tenant cap, sum of declared max_sessions over non-draining runners)
  #
  # and this line binds only while declared capacity EXCEEDS it. Read the right-hand term
  # from `runner_pool` before reasoning about spend; do not infer it from this file.
  # Measured on the live pool 2026-09-16 21:33Z: blockit max_sessions 2, draining; mac-mini
  # max_sessions 2, draining; minis max_sessions 1, not draining — so declared capacity was
  # 1 and the effective ceiling was min(2, 1) = 1, which at roughly USD 10-20 per implement
  # run (KB a08b94b2) is roughly USD 10-20/hour sustained. That is a DATED reading of a pool
  # that changes on every enrolment and every drain, never a standing fact about how many
  # runners there are.
  #
  # 2, because implementation quality is still n=1: exactly one successful unattended run
  # (KB a08b94b2). What the cap BUYS is not cutting today's fleet down — today's fleet is
  # already below it — but surviving the day somebody re-enrols three runners at 4 slots
  # each: declared capacity 12, spend held at 2 concurrent (roughly USD 20-40/hour) until
  # this line is deliberately raised. Raise it when several runs have landed reviewable
  # work, not before.
  # 3 since 2026-11-07: Mark put ryzen and x1 in the implementer pool beside minis ("minis
  # shouldn't be the only available implementer"), each declaring one session, and a cap of 2
  # would leave one of the three idle by policy. Roughly USD 30-60/hour at full use.
  RUNNER_MAX_IN_FLIGHT_SESSIONS = "3"

  # A TRIAGE session reads a ticket and answers with a verdict — a fraction of an
  # implement run — so it gets its own far smaller pair (#803 §4). Inheriting the
  # implement numbers would hand a reading session two hours of wall clock.
  #
  # ONE MEASURED RUN. 600 s / 40 turns was a reasoned guess until 2026-11-07, when the first
  # ticket triage (HCB #3922, minis) returned its verdict 602 s after dispatch: right at the
  # budget. Raised to 1200 s, 2x that run. What a too-small budget looks like: the runner
  # reports `wall_clock_exceeded` or `no_verdict_written` (runner_contract.ex:1463), and
  # TriageVerdict.route/1 (triage_verdict.ex:230) escalates EVERY incomplete reason — so
  # every ticket escalates to a human while the workers log clean `:dispatched` tallies and
  # the loop reads as working. There is no error to notice. Keep checking triage runs
  # against these numbers.
  TRIAGE_WALL_CLOCK_SECONDS = "1200"
  TRIAGE_MAX_TURNS = "40"

  # spec_tuner@1's own pair (US-48.13). The runner bounds the WHOLE tuning run by this wall
  # clock, and its critic replays every eval case of the target spec under the current and the
  # proposed template, each with that case's own wall_clock_seconds — so the triage pair cannot
  # hold it. Sized from loopctl-runner's eval/ sets on 2026-11-07, existing cases plus the 5 new
  # ones a result may add (SpecTunerV1.max_new_cases/0), all run twice: implement@1 is the
  # largest at 2 x (600+1800+1800) + 2 x 5 x 1800 = 26400 s; triage@1 is 2 x 6 x 900 + 2 x 5 x
  # 900 = 19800 s. 28800 s leaves 2400 s for the reading session. Re-derive it when a case set
  # grows or a case's wall clock rises. Unused while DRAFT_DISPATCH_ENABLED is off.
  SPEC_TUNE_WALL_CLOCK_SECONDS = "28800"
  SPEC_TUNE_MAX_TURNS = "80"
  # BEAM clustering over Fly's private network. DNSCluster resolves this name to every
  # started machine's 6PN address and connects to the node of the same release there; the
  # node name and IPv6 distribution come from rel/env.sh.eex. Not a secret: it names no
  # credential, and a secret would silently override this line.
  #
  # EXPECTED_APP_NODES is the number of machines that CAN run: the DbCapacity connection
  # budget multiplies the per-node pools by it, so it must stay the true maximum (2), not
  # the number usually running. Change it when the machine count changes.
  #
  # CLUSTER_PEERS_MAY_SUSPEND is deliberately unset: min_machines_running below equals
  # EXPECTED_APP_NODES, so a missing peer is a fault and Loopctl.ClusterReadiness alarms
  # `expected_peers_missing`. test/loopctl/fly_toml_test.exs holds that to [http_service].
  DNS_CLUSTER_QUERY = "loopctl.internal"
  EXPECTED_APP_NODES = "2"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # 2 since 2026-11-02: every Claude session on the fleet depends on loopctl, and with 1 an
  # OOM kill of the running machine left nothing serving until the proxy woke the other.
  min_machines_running = 2

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

  [http_service.http_options]
    h2_backend = false

  # LIVENESS ONLY — this is the CONTINUOUS check that decides whether a running node
  # stays in the load-balancer's traffic rotation (10s interval, every node, forever).
  # It intentionally targets plain /health (liveness: database + oban only), never
  # /health/ready (US-32.4's deploy-time smoke gate for the scale-alerts config-guard).
  # A benign, purely observational misconfig (scale alerts enabled, no webhook URL) must
  # never depool an otherwise-healthy node — see Loopctl.HealthCheck.Default's moduledoc.
  # GET /health/ready is deliberately NOT wired into THIS continuous check for that
  # reason, but it is not left unpolled: scripts/smoke.sh (the CI post-deploy detector,
  # .github/workflows/ci.yml `smoke` job) asserts it explicitly after every deploy, so a
  # genuine misconfig still turns the deploy pipeline RED.
  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

# US-27.15: Fly's managed Prometheus scrapes app metrics from this INTERNAL port over
# the private 6PN network. Port 9568 is NOT published in `http_service` above (only
# 8080 is public), so `/metrics` is never reachable from the internet — only by the
# Fly scraper. The metrics carry safe, bounded dimensions only (endpoint, mapped_code,
# cap-gated tenant_id) — no vectors/bodies/params/article_ids. The port MUST match
# `:metrics_port` (runtime.exs / METRICS_PORT). Series surface in fly-metrics.net Grafana;
# alert rules are documented in docs/runbooks/knowledge-scale.md.
[metrics]
  port = 9568
  path = "/metrics"

# 1024mb since 2026-11-02: at 512mb machine 2872420c0d2348 was OOM-killed
# (exit 137, oom_killed=true) at 2026-11-02T00:50Z and sessions saw loopctl as
# down. Lower it only with a peak-RSS measurement under the real load.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
