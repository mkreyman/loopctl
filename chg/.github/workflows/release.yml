name: release

# Builds the two fleet artifacts on a version tag and attaches them to the GitHub release:
# chg-aarch64-apple-darwin (mac-mini, blockit) and chg-x86_64-unknown-linux-musl (minis,
# nuc, beelink; static, so no glibc to keep in step across machines).
on:
  push:
    tags: ["v*"]
  # A PR that touches the release path builds both artifacts without publishing.
  pull_request:
    paths: [".github/workflows/release.yml", "scripts/install.sh", "Cargo.toml", "Cargo.lock", "cli/**"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain from .tool-versions
        run: |
          ver=$(awk '$1=="rust"{print $2}' .tool-versions)
          rustup toolchain install "$ver" --profile minimal --target ${{ matrix.target }}
          echo "RUSTUP_TOOLCHAIN=$ver" >> "$GITHUB_ENV"
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} -p chg
      - name: Smoke the artifact
        run: |
          out=target/${{ matrix.target }}/release/chg
          "$out" --version | grep -q "(adapter contract "
          cp "$out" chg-${{ matrix.target }}
          shasum -a 256 chg-${{ matrix.target }} > chg-${{ matrix.target }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: chg-${{ matrix.target }}
          path: chg-${{ matrix.target }}*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --notes "chg $TAG"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*
