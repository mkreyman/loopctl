name: release

# Builds the Linux fleet artifact on a version tag and attaches it to the GitHub release:
# chg-x86_64-unknown-linux-musl (minis, nuc, beelink; static, so no glibc to keep in step
# across machines). It runs on beelink's runner pool, never GitHub-hosted minutes. No
# macOS artifact: there is no macOS runner, and the Macs build chg from source
# (scripts/install.sh), as every host does.
on:
  push:
    tags: ["v*"]
  # A PR that touches the release path builds the artifact without publishing.
  pull_request:
    # Not cli/** or Cargo.*: most PRs touch those, and ci.yml already builds them.
    paths: [".github/workflows/release.yml", "scripts/install.sh", "scripts/ci-rust-toolchain.sh"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl]
    runs-on: [self-hosted, beelink]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The musl target links with its self-contained CRT through the host cc: no musl-tools.
      - name: Toolchain from .tool-versions
        run: scripts/ci-rust-toolchain.sh --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p chg
      - name: Smoke the artifact
        run: |
          out=target/${{ matrix.target }}/release/chg
          "$out" --version | grep -q "(adapter contract "
          cp "$out" chg-${{ matrix.target }}
          shasum -a 256 chg-${{ matrix.target }} > chg-${{ matrix.target }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: chg-${{ matrix.target }}
          path: chg-${{ matrix.target }}*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: [self-hosted, beelink]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --notes "chg $TAG"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*
