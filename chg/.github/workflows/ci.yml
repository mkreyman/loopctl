name: ci

on:
  pull_request:
  push:
    branches: [master]

# A PR keeps only its newest run. Every master push gets its own group (keyed by sha),
# so no master commit loses its verdict to a later push: the post-merge verifier and
# culprit finder (design §3.8) need one result per commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # chg has no self-hosted registration and is not in either host's
          # INFRA_POOL_REPOS (infra runbooks/ci-runner-setup.md). Setting the repo
          # variable CI_RUNNER to '["self-hosted","beelink"]' moves the Linux leg there,
          # provided that host has rustup or asdf (the toolchain step uses either).
          - os: linux
            runner: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
          # The APFS clonefile(2) path (design §3.5) only compiles on macOS.
          - os: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain from .tool-versions
        # Pins the toolchain for this job only (RUSTUP_TOOLCHAIN), never `rustup default`,
        # which is per-user state shared by every job on a persistent runner.
        run: |
          ver=$(awk '$1=="rust"{print $2}' .tool-versions)
          if command -v rustup >/dev/null; then
            rustup toolchain install "$ver" --profile minimal --component rustfmt,clippy
          elif command -v asdf >/dev/null; then
            asdf plugin list | grep -qx rust || asdf plugin add rust
            asdf install rust "$ver"
            echo "$HOME/.asdf/shims" >> "$GITHUB_PATH"
          else
            echo "::error::runner has neither rustup nor asdf; provision one to build chg"
            exit 1
          fi
          echo "RUSTUP_TOOLCHAIN=$ver" >> "$GITHUB_ENV"
      # The Linux clone path needs reflink; the hosted image's ext4 has none, so the
      # clone tests run on an XFS loop image (the same setup as bin/chg-volume-setup.sh).
      - name: XFS reflink scratch volume
        if: matrix.os == 'linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xfsprogs >/dev/null
          truncate -s 2G "$RUNNER_TEMP/xfs.img"
          mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/xfs.img"
          sudo mkdir -p /mnt/chg-xfs
          sudo mount -o loop "$RUNNER_TEMP/xfs.img" /mnt/chg-xfs
          sudo chown "$(id -u):$(id -g)" /mnt/chg-xfs
          echo "CHG_TEST_REFLINK_DIR=/mnt/chg-xfs" >> "$GITHUB_ENV"
      # A self-hosted Linux runner tests on its chg volume (S5). Without one the clone
      # tests fail rather than skip: CI=true makes a missing CHG_TEST_REFLINK_DIR an error.
      - name: chg volume on a self-hosted runner
        if: matrix.os == 'linux' && runner.environment == 'self-hosted'
        run: |
          # ci-tmp is 1777 (bin/chg-volume-setup.sh), so the runner account can write it.
          if [ -d /srv/chg/ci-tmp ] && [ -w /srv/chg/ci-tmp ]; then
            echo "CHG_TEST_REFLINK_DIR=/srv/chg/ci-tmp" >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          # Hosted and self-hosted runs must never share a cache entry
          # (infra runbooks/ci-runner-setup.md: keys include runner.environment).
          key: ${{ runner.environment }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # No --all-targets: that flag excludes doctests.
      - run: cargo test --locked

  # bin/chg-volume-setup.sh mounts and writes fstab, so its test needs root and a
  # throwaway machine: a hosted runner, never a self-hosted one.
  volume-setup:
    name: volume-setup (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update -q && sudo apt-get install -yq xfsprogs shellcheck >/dev/null
      - run: shellcheck bin/chg-volume-setup.sh tests/volume-setup-test.sh
      - run: sudo bash tests/volume-setup-test.sh

  # The Mix adapter (adapters/elixir): its unit tests, and an integration test that
  # installs it as an archive and drives a fixture project through every task, including
  # `chg adapter exec` (CHG_BIN), which applies always_all before the adapter runs.
  # Twice: on adapters/elixir/.tool-versions, and on the oldest Elixir its mix.exs accepts
  # (loopctl is on 1.19), since the adapter reads Mix's version-specific manifests.
  elixir-adapter:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: elixir-adapter (linux)
          - name: elixir-adapter (linux, elixir 1.19)
            elixir: "1.19.5"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: adapters/elixir
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        if: ${{ !matrix.elixir }}
        with:
          version-file: adapters/elixir/.tool-versions
          version-type: strict
      # The pinned OTP, so the two legs differ only in Elixir.
      - name: OTP from .tool-versions
        if: ${{ matrix.elixir }}
        id: otp
        working-directory: .
        run: echo "version=$(awk '$1=="erlang"{print $2}' adapters/elixir/.tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: erlef/setup-beam@v1
        if: ${{ matrix.elixir }}
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ steps.otp.outputs.version }}
          version-type: strict
      - name: Rust toolchain from .tool-versions
        working-directory: .
        run: |
          ver=$(awk '$1=="rust"{print $2}' .tool-versions)
          rustup toolchain install "$ver" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$ver" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.elixir || 'pinned' }}
      - name: Build chg
        working-directory: .
        run: cargo build --locked -p chg && echo "CHG_BIN=$PWD/target/debug/chg" >> "$GITHUB_ENV"
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      # The formatter's output differs across versions: checked on the pinned one only.
      - run: mix format --check-formatted
        if: ${{ !matrix.elixir }}
      - run: mix compile --warnings-as-errors
      - run: mix test

  # The pnpm adapter (adapters/typescript): unit tests, and an integration test that drives
  # a fixture workspace through every command, including `chg adapter exec` (CHG_BIN).
  typescript-adapter:
    name: typescript-adapter (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: adapters/typescript
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: adapters/typescript/.tool-versions
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - name: Rust toolchain from .tool-versions
        working-directory: .
        run: |
          ver=$(awk '$1=="rust"{print $2}' .tool-versions)
          rustup toolchain install "$ver" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$ver" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Build chg
        working-directory: .
        run: cargo build --locked -p chg && echo "CHG_BIN=$PWD/target/debug/chg" >> "$GITHUB_ENV"
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - run: node --test test/unit.test.mjs test/integration.test.mjs
