[package]
name = "chg"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version = "1.99"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
hmac = "0.12"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "1"

[target.'cfg(target_os = "linux")'.dependencies]
rayon = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
