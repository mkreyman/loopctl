[adapter]
kind = "elixir"
version = "1"
artifacts = ["deps", "_build", "priv/plts"]
inputs = ["lib/**", "test/**", "config/**", "priv/**", "mix.exs", "mix.lock", ".tool-versions"]
always_all = ["mix.exs", "mix.lock", "config/**", "priv/repo/migrations/**", "test/test_helper.exs", "test/support/**", ".tool-versions", ".chg/**"]
isolation_env = { MIX_TEST_PARTITION = "{workspace_slot}" }

[commands]
snapshot = "sh .chg/fake-adapter.sh snapshot"
static   = "sh .chg/fake-adapter.sh static {base}"
affected = "sh .chg/fake-adapter.sh affected {base}"
run      = "sh .chg/fake-adapter.sh run {file}"
shard    = "sh .chg/fake-adapter.sh shard {n} {i}"
